<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Musas | Login & Agendamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            transition: all 0.2s ease;
        }

        .card {
            background: #1f1f1f;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 2rem 1.8rem;
            border: 1px solid #333;
            transition: transform 0.2s;
        }

        .card h2 {
            color: #f0f0f0;
            font-weight: 600;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
        }

        .card .sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            border-bottom: 1px solid #2c2c2c;
            display: inline-block;
            width: 100%;
            padding-bottom: 0.75rem;
        }

        .input-group {
            margin-bottom: 1.3rem;
        }

        .input-group label {
            display: block;
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 0.9rem 1rem;
            background-color: #2a2a2a;
            border: 1px solid #3f3f3f;
            border-radius: 1.2rem;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #aaaaaa;
            background-color: #2f2f2f;
            box-shadow: 0 0 0 2px rgba(170,170,170,0.2);
        }

        .input-group input::placeholder {
            color: #6b6b6b;
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.2s;
            background: #3a3a3a;
            color: white;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: #ffffff;
            color: #111;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            background: #e6e6e6;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #2c2c2c;
            border: 1px solid #4a4a4a;
        }

        .btn-secondary:hover {
            background: #3a3a3a;
        }

        .link-action {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #aaa;
        }

        .link-action a {
            color: #dddddd;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid #666;
        }

        .link-action a:hover {
            color: white;
        }

        .error-msg {
            background: #2c1a1a;
            color: #ff9e9e;
            font-size: 0.8rem;
            padding: 0.6rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            text-align: center;
            border-left: 3px solid #ff5e5e;
        }

        .success-msg {
            background: #1a2a1f;
            color: #b4ffb4;
            border-left: 3px solid #6eff6e;
        }

        .discount-badge {
            background: linear-gradient(135deg, #2c2c2c, #202020);
            border-left: 4px solid #ffcc66;
            padding: 0.75rem;
            border-radius: 1rem;
            margin: 0.5rem 0 1rem 0;
            color: #ffdd99;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .services-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1.5rem 0;
        }

        .service-option {
            background: #262626;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #3a3a3a;
            transition: all 0.15s;
        }

        .service-option.selected {
            background: #2e2e2e;
            border-color: #b0b0b0;
            box-shadow: 0 0 0 1px #aaa;
        }

        .service-info h4 {
            color: white;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .service-info p {
            color: #9a9a9a;
            font-size: 0.75rem;
        }

        .service-price {
            color: #c0c0c0;
            font-weight: 600;
            background: #1e1e1e;
            padding: 0.3rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .original-price {
            font-size: 0.7rem;
            text-decoration: line-through;
            color: #888;
        }

        .discount-price {
            color: #ffcc66;
            font-weight: bold;
        }

        .datetime-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1rem 0;
        }

        .datetime-row .input-group {
            flex: 1;
            margin-bottom: 0.5rem;
        }

        .booking-summary {
            background: #181818;
            border-radius: 1.2rem;
            padding: 1rem;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .flex-btns {
            display: flex;
            gap: 1rem;
        }

        .flex-btns .btn {
            flex: 1;
        }

        .logout-btn {
            background: #2c2c2c;
            color: #ddd;
            border: 1px solid #4a4a4a;
            margin-bottom: 1rem;
        }

        .logout-btn:hover {
            background: #3f3f3f;
        }

        .welcome-tag {
            background: #2b2b2b;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            font-size: 0.75rem;
            color: #ccc;
            margin-bottom: 1rem;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
            .datetime-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<!-- Firebase + EmailJS -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="firebase-config.js"></script>
<script src="email-config.js"></script>
<script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();
    if (EMAIL_CONFIG.publicKey && !EMAIL_CONFIG.publicKey.includes('COLE_')) {
        emailjs.init({ publicKey: EMAIL_CONFIG.publicKey });
    }
</script>

<body>
<div class="app-container" id="appContainer">
    <!-- TELA DE LOGIN -->
    <div id="loginScreen">
        <div class="card">
            <div class="sub"><img src="musas.png" alt="logo" width="270px" onerror="this.style.display='none'"></div>
            <div id="loginError" class="error-msg" style="display: none;"></div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="cliente@exemplo.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="********">
            </div>
            <button class="btn btn-primary" id="doLoginBtn">Entrar</button>
            <div style="display:flex;align-items:center;gap:.7rem;margin:1rem 0;color:#777;font-size:.8rem;">
                <span style="height:1px;background:#3a3a3a;flex:1"></span><span>ou</span><span style="height:1px;background:#3a3a3a;flex:1"></span>
            </div>
            <button class="btn btn-secondary" id="googleLoginBtn" style="display:flex;align-items:center;justify-content:center;gap:.6rem;">
                <span style="font-size:1.1rem">G</span> Continuar com Google
            </button>
            <div class="link-action">
                Não tem conta? <a href="#" id="goToRegisterLink">Cadastre-se</a>
            </div>
        </div>
    </div>

    <!-- TELA DE CADASTRO -->
    <div id="registerScreen" style="display: none;">
        <div class="card">
            <h2>Criar conta</h2>
            <div class="sub">Bem-vinda(o) ao salão</div>
            <div id="registerError" class="error-msg" style="display: none;"></div>
            <div class="input-group">
                <label>Nome completo</label>
                <input type="text" id="regName" placeholder="Ana Silva">
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="regEmail" placeholder="cliente@email.com">
            </div>
            <div class="input-group">
                <label>Data de Nascimento</label>
                <input type="date" id="regBirthdate">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="regPassword" placeholder="mínimo 6 caracteres">
            </div>
            <button class="btn btn-primary" id="doRegisterBtn">Cadastrar</button>
            <div class="link-action">
                Já tem conta? <a href="#" id="goToLoginLink">Faça login</a>
            </div>
        </div>
    </div>

    <!-- TELA DE AGENDAMENTO -->
    <div id="bookingScreen" style="display: none;">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>📅 Agendamento</h2>
                <button id="logoutBtnMain" class="logout-btn" style="width: auto; padding: 0.4rem 1rem; font-size: 0.8rem;">Sair</button>
            </div>
            <div class="welcome-tag" id="welcomeUser"></div>

            <div id="birthdayDiscountBanner" style="display: none;" class="discount-badge">
                🎂✨ PARABÉNS! Você ganha 10% de desconto em todos os serviços esta semana! ✨🎂
            </div>

            <div class="input-group">
                <label>💆‍♀️ Escolha um serviço</label>
            </div>
            <div class="services-grid" id="servicesList"></div>

            <div class="datetime-row">
                <div class="input-group">
                    <label>📆 Data</label>
                    <input type="date" id="bookingDate" min="">
                </div>
                <div class="input-group">
                    <label>⏰ Horário</label>
                    <select id="bookingTime">
                        <option value="">Selecione um horário</option>
                    </select>
                </div>
            </div>

            <div class="booking-summary" id="summaryPreview">
                Nenhum serviço selecionado
            </div>
            <div class="flex-btns">
                <button class="btn btn-secondary" id="clearBookingBtn">Limpar</button>
                <button class="btn btn-primary" id="confirmBookingBtn">Confirmar Agendamento</button>
            </div>
            <div id="bookingFeedback" class="error-msg" style="display: none; margin-top: 1rem;"></div>
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE INTEGRATION ====================
    let currentUser = null;
    let currentUserProfile = null;

    let SERVICES = [];
    const DEFAULT_SERVICES = [
        { id: 'corte', name: '✂️ Corte e Escova', price: 'R$ 65,00', duration: '45min' },
        { id: 'coloracao', name: '🎨 Coloração + Matização', price: 'R$ 120,00', duration: '1h30' },
        { id: 'manicure', name: '💅 Manicure & Pedicure', price: 'R$ 55,00', duration: '1h' },
        { id: 'hidratacao', name: '💧 Hidratação Capilar', price: 'R$ 80,00', duration: '50min' }
    ];

    function formatServicePrice(value) {
        const number = Number(value || 0);
        return number.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function loadServices() {
        try {
            const snap = await db.collection('servicos').get();
            const loaded = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (data.ativo === false) return;
                loaded.push({
                    id: doc.id,
                    name: data.nome || 'Serviço',
                    price: formatServicePrice(data.preco),
                    duration: data.duracao || '-',
                    ordem: data.ordem || 999
                });
            });
            loaded.sort((a,b) => (a.ordem || 999) - (b.ordem || 999) || a.name.localeCompare(b.name));
            SERVICES = loaded.length ? loaded : DEFAULT_SERVICES.slice();
        } catch (e) {
            console.error('Erro ao carregar serviços:', e);
            SERVICES = DEFAULT_SERVICES.slice();
        }
    }

    const AVAILABLE_TIMES = [
        '09:00','09:30','10:00','10:30','11:00','11:30',
        '13:00','13:30','14:00','14:30','15:00','15:30',
        '16:00','16:30','17:00','17:30','18:00','18:30'
    ];

    let selectedServiceId = null;
    let selectedDate = '';
    let selectedTime = '';
    let bookingFieldsBound = false;

    const loginScreen = document.getElementById('loginScreen');
    const registerScreen = document.getElementById('registerScreen');
    const bookingScreen = document.getElementById('bookingScreen');

    function formatarData(data) {
        if (!data) return 'não definida';
        const partes = data.split('-');
        return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : data;
    }

    function isBirthdayWeek(birthdateStr) {
        if (!birthdateStr) return false;
        const [y,m,d] = birthdateStr.split('-').map(Number);
        if (!y || !m || !d) return false;
        const today = new Date();
        const birthdayThisYear = new Date(today.getFullYear(), m - 1, d);
        const diffDays = Math.round((birthdayThisYear - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
        return Math.abs(diffDays) <= 3;
    }

    function getPriceWithDiscount(originalPriceStr, hasDiscount) {
        if (!hasDiscount) return originalPriceStr;
        const priceValue = Number(originalPriceStr.replace('R$','').trim().replace('.','').replace(',','.'));
        if (Number.isNaN(priceValue)) return originalPriceStr;
        return `R$ ${(priceValue * 0.9).toFixed(2).replace('.', ',')}`;
    }

    function hasBirthdayDiscount() {
        return !!(currentUserProfile?.nascimento && isBirthdayWeek(currentUserProfile.nascimento));
    }

    function updateDiscountBanner() {
        const banner = document.getElementById('birthdayDiscountBanner');
        if (banner) banner.style.display = hasBirthdayDiscount() ? 'flex' : 'none';
    }

    function renderServices() {
        const container = document.getElementById('servicesList');
        if (!container) return;
        container.innerHTML = '';
        const discountActive = hasBirthdayDiscount();
        SERVICES.forEach(service => {
            const serviceDiv = document.createElement('div');
            serviceDiv.className = `service-option ${selectedServiceId === service.id ? 'selected' : ''}`;
            const discountedPrice = discountActive ? getPriceWithDiscount(service.price, true) : service.price;
            serviceDiv.innerHTML = `
                <div class="service-info"><h4>${service.name}</h4><p>⏱️ ${service.duration}</p></div>
                ${discountActive ? `<div class="service-price"><span class="original-price">${service.price}</span><span class="discount-price">${discountedPrice}</span></div>` : `<div class="service-price">${service.price}</div>`}
            `;
            serviceDiv.addEventListener('click', () => {
                selectedServiceId = service.id;
                renderServices();
                updateSummary();
            });
            container.appendChild(serviceDiv);
        });
    }

    function updateSummary() {
        syncBookingFieldsFromDom();
        const summaryDiv = document.getElementById('summaryPreview');
        const service = SERVICES.find(s => s.id === selectedServiceId);
        let servicePrice = service?.price || '---';
        if (service && hasBirthdayDiscount()) servicePrice = `${getPriceWithDiscount(service.price, true)} (com 10% off)`;
        summaryDiv.innerHTML = `
            <strong>📋 Resumo do agendamento</strong><br>
            ✨ Serviço: ${service?.name || 'Nenhum serviço'} (${servicePrice})<br>
            📅 Data: ${formatarData(selectedDate)}<br>
            ⏰ Horário: ${selectedTime || 'não definido'}<br>
            ${service && hasBirthdayDiscount() ? '<span style="color:#ffcc66">🎂 Desconto de aniversário aplicado!</span>' : ''}
        `;
    }

    async function populateTimes() {
        const timeSelect = document.getElementById('bookingTime');
        if (!selectedDate) {
            timeSelect.innerHTML = '<option value="">Escolha uma data primeiro</option>';
            return;
        }
        timeSelect.innerHTML = '<option value="">Carregando...</option>';
        try {
            const snap = await db.collection('disponibilidade').where('data', '==', selectedDate).get();
            const ocupados = new Set();
            snap.forEach(doc => {
                const slot = doc.data();
                if (slot.horario) ocupados.add(slot.horario);
            });
            const livres = AVAILABLE_TIMES.filter(h => !ocupados.has(h));
            timeSelect.innerHTML = '<option value="">Selecione um horário</option>' + livres.map(h => `<option value="${h}">${h}</option>`).join('');
            if (!livres.length) timeSelect.innerHTML = '<option value="">Nenhum horário disponível</option>';
        } catch (e) {
            console.error(e);
            timeSelect.innerHTML = '<option value="">Erro ao carregar horários</option>';
        }
    }

    function setMinDate() {
        const d = new Date();
        const local = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
        document.getElementById('bookingDate').min = local;
    }

    function syncBookingFieldsFromDom() {
        const dateInput = document.getElementById('bookingDate');
        const timeSelect = document.getElementById('bookingTime');

        if (dateInput?.value) selectedDate = dateInput.value;
        if (timeSelect?.value) selectedTime = timeSelect.value;
    }

    function bindBookingFields() {
        if (bookingFieldsBound) return;
        bookingFieldsBound = true;

        const dateInput = document.getElementById('bookingDate');
        const timeSelect = document.getElementById('bookingTime');

        const handleDateChange = async e => {
            selectedDate = e.target.value || '';
            selectedTime = '';
            if (timeSelect) timeSelect.value = '';
            await populateTimes();
            updateSummary();
        };

        // "input" + "change" deixa o campo de data confiável em navegadores diferentes.
        dateInput.addEventListener('input', handleDateChange);
        dateInput.addEventListener('change', handleDateChange);

        timeSelect.addEventListener('change', e => {
            selectedTime = e.target.value || '';
            syncBookingFieldsFromDom();
            updateSummary();
        });
    }

    function clearBookingSelection() {
        selectedServiceId = null; selectedDate = ''; selectedTime = '';
        document.getElementById('bookingDate').value = '';
        document.getElementById('bookingTime').innerHTML = '<option value="">Selecione um horário</option>';
        renderServices(); updateSummary();
    }

    async function getOrCreateProfile(user) {
        const ref = db.collection('usuarios').doc(user.uid);
        const snap = await ref.get();
        if (snap.exists) return { id: snap.id, ...snap.data() };
        const profile = {
            nome: user.displayName || user.email?.split('@')[0] || 'Cliente',
            email: user.email || '',
            nascimento: null,
            tipo: 'cliente',
            criado_em: firebase.firestore.FieldValue.serverTimestamp()
        };
        await ref.set(profile);
        return { id: user.uid, ...profile };
    }

    async function routeAfterLogin(user) {
        currentUser = user;
        currentUserProfile = await getOrCreateProfile(user);
        const tipoUsuario = String(currentUserProfile?.tipo || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        console.log('Tipo do usuário:', tipoUsuario);
        if (tipoUsuario === 'funcionario') {
            window.location.href = 'dashboard.html';
            return;
        }
        await showBookingScreen();
    }

    async function sendBookingEmails(appointment) {
        if (!EMAIL_CONFIG.enabled) return { skipped: true };
        if (!EMAIL_CONFIG.serviceId || !EMAIL_CONFIG.templateId || !EMAIL_CONFIG.publicKey) return { skipped: true };
        const common = {
            cliente_nome: appointment.cliente_nome,
            cliente_email: appointment.cliente_email,
            servico: appointment.servico,
            data: formatarData(appointment.data),
            horario: appointment.horario,
            valor: appointment.valor_final
        };
        await emailjs.send(EMAIL_CONFIG.serviceId, EMAIL_CONFIG.templateId, {
            ...common,
            to_email: appointment.cliente_email,
            recipient_name: appointment.cliente_nome,
            tipo_mensagem: 'Seu agendamento foi confirmado com sucesso.'
        });
        await new Promise(r => setTimeout(r, 1100));
        await emailjs.send(EMAIL_CONFIG.serviceId, EMAIL_CONFIG.templateId, {
            ...common,
            to_email: APP_CONFIG.employeeEmail,
            recipient_name: APP_CONFIG.employeeName,
            tipo_mensagem: 'Um novo agendamento foi realizado no Musas.'
        });
        return { sent: true };
    }

    async function confirmBooking() {
        const feedbackDiv = document.getElementById('bookingFeedback');

        // Garante que a data/horário visíveis na tela sejam usados,
        // mesmo se o Firebase Auth disparar uma segunda atualização da interface.
        syncBookingFieldsFromDom();

        if (!selectedServiceId || !selectedDate || !selectedTime) {
            feedbackDiv.textContent = '❌ Selecione serviço, data e horário.';
            feedbackDiv.style.display = 'block';
            feedbackDiv.className = 'error-msg';
            return;
        }
        if (!currentUser) return;
        const service = SERVICES.find(s => s.id === selectedServiceId);
        const discountActive = hasBirthdayDiscount();
        const finalPrice = discountActive ? getPriceWithDiscount(service.price, true) : service.price;
        const slotId = `${selectedDate}_${selectedTime.replace(':','-')}`;
        const agendamentoRef = db.collection('agendamentos').doc(slotId);
        const disponibilidadeRef = db.collection('disponibilidade').doc(slotId);
        const btn = document.getElementById('confirmBookingBtn');
        btn.disabled = true; btn.textContent = '⏳ Salvando...';
        let appointment;
        try {
            appointment = {
                usuario_id: currentUser.uid,
                cliente_nome: currentUserProfile.nome || currentUser.displayName || currentUser.email,
                cliente_email: currentUser.email || currentUserProfile.email || '',
                servico_id: service.id,
                servico: service.name,
                data: selectedDate,
                horario: selectedTime,
                valor_original: service.price,
                valor_final: finalPrice,
                desconto_aniversario: discountActive,
                status: 'Agendado',
                criado_em: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.runTransaction(async tx => {
                const existingSlot = await tx.get(disponibilidadeRef);
                if (existingSlot.exists) throw new Error('HORARIO_OCUPADO');
                tx.set(disponibilidadeRef, {
                    data: selectedDate,
                    horario: selectedTime,
                    usuario_id: currentUser.uid,
                    criado_em: firebase.firestore.FieldValue.serverTimestamp()
                });
                tx.set(agendamentoRef, appointment);
            });
            feedbackDiv.className = 'error-msg success-msg';
            feedbackDiv.textContent = `✅ Agendamento confirmado! ${service.name} em ${formatarData(selectedDate)} às ${selectedTime}. Valor: ${finalPrice}.`;
            feedbackDiv.style.display = 'block';
            try {
                const emailResult = await sendBookingEmails(appointment);
                if (emailResult?.skipped) feedbackDiv.textContent += ' E-mail ainda não configurado; veja o README.';
                else feedbackDiv.textContent += ' Confirmação enviada por e-mail.';
            } catch (emailError) {
                console.error('Falha no e-mail:', emailError);
                feedbackDiv.textContent += ' Agendamento salvo, mas o e-mail não pôde ser enviado.';
            }
            clearBookingSelection();
            await populateTimes();
        } catch (e) {
            console.error(e);
            feedbackDiv.className = 'error-msg';
            feedbackDiv.style.display = 'block';
            feedbackDiv.textContent = e.message === 'HORARIO_OCUPADO' ? '❌ Esse horário acabou de ser reservado. Escolha outro.' : `❌ Erro ao agendar: ${e.message}`;
            await populateTimes();
        } finally {
            btn.disabled = false; btn.textContent = 'Confirmar Agendamento';
        }
    }

    async function showBookingScreen() {
        loginScreen.style.display = 'none'; registerScreen.style.display = 'none'; bookingScreen.style.display = 'block';
        document.getElementById('welcomeUser').innerHTML = `👋 Olá, ${currentUserProfile?.nome || currentUser.email} | ✨ Agende seu horário`;
        updateDiscountBanner();

        // Não zera a data/horário que já estiverem visíveis no formulário.
        // Isso evita perder a seleção quando o estado de autenticação é processado novamente.
        selectedServiceId = selectedServiceId || null;
        selectedDate = document.getElementById('bookingDate')?.value || selectedDate || '';
        selectedTime = document.getElementById('bookingTime')?.value || selectedTime || '';

        await loadServices();
        renderServices(); setMinDate(); bindBookingFields(); syncBookingFieldsFromDom(); updateSummary();
    }

    function showLogin() {
        loginScreen.style.display = 'block'; registerScreen.style.display = 'none'; bookingScreen.style.display = 'none';
        document.getElementById('loginError').style.display = 'none';
    }
    function showRegister() {
        loginScreen.style.display = 'none'; registerScreen.style.display = 'block'; bookingScreen.style.display = 'none';
        document.getElementById('registerError').style.display = 'none';
    }

    async function logout() { await auth.signOut(); showLogin(); }

    async function doLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        try {
            const cred = await auth.signInWithEmailAndPassword(email, password);
            await routeAfterLogin(cred.user);
        } catch (e) {
            console.error(e); errorDiv.textContent = 'E-mail ou senha inválidos.'; errorDiv.style.display = 'block';
        }
    }

    async function doGoogleLogin() {
        const errorDiv = document.getElementById('loginError');
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            const cred = await auth.signInWithPopup(provider);
            await routeAfterLogin(cred.user);
        } catch (e) {
            console.error(e); errorDiv.textContent = `Não foi possível entrar com Google: ${e.message}`; errorDiv.style.display = 'block';
        }
    }

    async function doRegister() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const birthdate = document.getElementById('regBirthdate').value;
        const password = document.getElementById('regPassword').value;
        const errorDiv = document.getElementById('registerError');
        if (!name || !email || !birthdate || !password) {
            errorDiv.textContent = 'Todos os campos são obrigatórios.'; errorDiv.style.display = 'block'; return;
        }
        if (password.length < 6) {
            errorDiv.textContent = 'A senha deve ter pelo menos 6 caracteres.'; errorDiv.style.display = 'block'; return;
        }
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            await cred.user.updateProfile({ displayName: name });
            await db.collection('usuarios').doc(cred.user.uid).set({
                nome: name, email, nascimento: birthdate, tipo: 'cliente', criado_em: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('Cadastro realizado com sucesso!');
            await routeAfterLogin(cred.user);
        } catch (e) {
            console.error(e); errorDiv.textContent = e.message; errorDiv.style.display = 'block';
        }
    }

    document.getElementById('doLoginBtn').addEventListener('click', doLogin);
    document.getElementById('googleLoginBtn').addEventListener('click', doGoogleLogin);
    document.getElementById('doRegisterBtn').addEventListener('click', doRegister);
    document.getElementById('goToRegisterLink').addEventListener('click', e => { e.preventDefault(); showRegister(); });
    document.getElementById('goToLoginLink').addEventListener('click', e => { e.preventDefault(); showLogin(); });
    document.getElementById('logoutBtnMain')?.addEventListener('click', logout);
    document.getElementById('clearBookingBtn')?.addEventListener('click', clearBookingSelection);
    document.getElementById('confirmBookingBtn')?.addEventListener('click', confirmBooking);
    document.getElementById('loginPassword')?.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('regPassword')?.addEventListener('keypress', e => { if (e.key === 'Enter') doRegister(); });

    auth.onAuthStateChanged(async user => {
        if (!user) return showLogin();
        try { await routeAfterLogin(user); } catch (e) { console.error(e); showLogin(); }
    });
</script>
</body>
</html>
